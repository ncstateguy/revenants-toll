<html lang="en">
<head>

<style>
/* Layout: full-bleed canvas crypt; DOM overlay screens float centered over the frozen game, stone-slab cards */
:root{
  --void:#0b0a0d; --stone:#19161c; --stone-2:#241f28; --line:#3b3341;
  --bone:#ece2cc; --dim:#a097a6; --ember:#ee8a3c; --gold:#e3bd5d; --blood:#a8291b;

  --f-body:'Alegreya Sans', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--void);color:var(--bone);font-family:var(--f-body);overflow:hidden;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#overlay{position:fixed;inset:0;display:flex;overflow-y:auto;z-index:5;
  background:radial-gradient(ellipse at 50% 35%, rgba(24,16,26,.55), rgba(5,4,7,.93));
  padding-block:max(24px, env(safe-area-inset-top,0px)) max(24px, env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.screen{margin:auto;width:100%;max-width:1200px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.eyebrow{text-transform:uppercase;letter-spacing:.24em;font-size:12px;font-weight:800;color:var(--ember);margin:0 0 4px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(56px,10vw,104px);line-height:.88;margin:0;color:var(--bone);
  text-shadow:0 0 34px rgba(238,138,60,.38),0 3px 0 #000;text-wrap:balance}
.lede{color:var(--dim);max-width:54ch;margin:10px auto 0;font-size:17px;line-height:1.4}
.cards{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;width:100%}
.card{appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;
  background:linear-gradient(180deg,var(--stone-2),var(--stone));border:1px solid var(--line);border-radius:6px;
  padding:14px;display:flex;flex-direction:column;gap:8px;transition:transform .12s,border-color .12s,box-shadow .12s;min-width:0}
.card.focus{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 12px 30px rgba(0,0,0,.55),0 0 34px rgba(227,189,93,.18);transform:translateY(-4px)}
.card:focus-visible,.mbtn:focus-visible,.pill:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.hero{width:212px}
.hero .portrait{width:100px;height:100px;align-self:center;border-radius:50%;

.hero h3{font-family:var(--f-display);font-weight:700;font-size:30px;margin:0;line-height:1;color:var(--hc);text-align:center}
.role{margin:-4px 0 2px;color:var(--dim);font-size:13px;text-align:center;font-style:italic}
.stats{display:flex;flex-direction:column;gap:4px}
.stat{display:grid;grid-template-columns:54px 1fr;align-items:center;gap:8px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.stat i{display:block;height:5px;background:#100e12;border-radius:3px;overflow:hidden}
.stat i b{display:block;height:100%;background:var(--hc)}
.kit{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.kit p{margin:0;font-size:13.5px;line-height:1.35;color:#cfc5d4}
.kit b{color:var(--bone)}
.kit .pas{color:var(--gold)}
.pick{display:flex;gap:20px;width:100%;align-items:stretch;justify-content:center;flex-wrap:wrap}
.fams{display:flex;flex-direction:column;gap:10px;flex:1 1 560px;max-width:700px}
.fam-row{display:flex;align-items:center;gap:10px}
.fam-adv{display:flex;gap:10px;flex:2}

.hcard{appearance:none;font:inherit;color:inherit;cursor:pointer;position:relative;flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;
  padding:6px 10px 6px 6px;border-radius:6px;border:1px solid var(--line);background:linear-gradient(180deg,var(--stone-2),var(--stone));transition:transform .12s,border-color .12s,box-shadow .12s}

.hd-top{display:flex;gap:12px;align-items:center}

.hd-lock,.hd-next{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:5px}

.newform{display:flex;gap:14px;align-items:center;text-align:left;background:var(--stone);border:1px solid var(--gold);border-radius:8px;padding:10px 16px;max-width:560px;box-shadow:0 0 30px rgba(227,189,93,.18)}

.g-a{background:#5fc35a}.g-b{background:#e0483e;color:#fff}.g-x{background:#3f8ae0;color:#fff}.g-y{background:#f2c230}.g-s{background:#c9c2cf;border-radius:5px}
kbd{font-family:var(--f-body);font-weight:800;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;background:var(--stone-2);color:var(--bone);vertical-align:middle}
.hints{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:center;color:var(--dim);font-size:14.5px}
.bar-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center;color:var(--dim);font-size:14px}

.up h3{margin:0;font-size:21px;font-weight:800;line-height:1.1}
.up p{margin:0;font-size:14.5px;line-height:1.4;color:#d4cad8}
.lv{font-size:13px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.lv .new{color:#7fd47a;letter-spacing:.12em;text-transform:uppercase}

.tag-weapon{color:var(--ember)}.tag-ability{color:#8fb6ff}.tag-trait{color:var(--gold)}.tag-relic{color:#e283d2}.tag-heal{color:#7fd47a}
.menu-list{display:flex;flex-direction:column;gap:8px;width:min(320px,100%)}
.mbtn{appearance:none;font:inherit;font-size:18px;font-weight:700;padding:12px 18px;border-radius:6px;border:1px solid var(--line);background:var(--stone);color:var(--bone);cursor:pointer}

.build{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;width:100%;text-align:left}
.build section{background:var(--stone);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0;width:min(270px,100%)}
.build h4{margin:0 0 8px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ember)}
.build ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px;color:#d4cad8}
.build li span{color:var(--dim);font-variant-numeric:tabular-nums;float:right}
.endstats{display:flex;flex-wrap:wrap;gap:12px 36px;justify-content:center}
.endstats div{display:flex;flex-direction:column}
.endstats b{font-family:var(--f-display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.endstats span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.dmg{width:min(560px,100%);display:flex;flex-direction:column;gap:6px;text-align:left}
.dmg-row{display:grid;grid-template-columns:minmax(0,150px) 1fr 64px;gap:10px;align-items:center;font-size:14px}
.dmg-row i{display:block;height:8px;background:#100e12;border-radius:4px;overflow:hidden}
.dmg-row i b{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--gold))}
.dmg-row span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
.win h2{color:var(--gold)} .lose h2{color:#e2606c}
.arm{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;width:100%;text-align:left;align-items:flex-start}
.arm .col{flex:1 1 480px;min-width:0;max-width:760px;display:flex;flex-direction:column;gap:8px}
.menu-list.row{flex-direction:row;flex-wrap:wrap;justify-content:center;width:auto}
.lbl{margin:6px 0 0;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ember);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slot{appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--stone);border:1px solid var(--line);border-radius:5px;padding:9px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.slot.empty{opacity:.6;border-style:dashed}
.slot.dead{cursor:default}
.slot.focus{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);background:var(--stone-2);opacity:1}
.mini-name{font-weight:800;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-name.empty{color:var(--dim);font-weight:600}
.mini-meta{font-size:11.5px;color:var(--dim)}
.detail{flex:0 1 320px;min-width:0;width:min(320px,100%)}
.tip{background:#141117;border:1px solid var(--rc,var(--line));border-top:3px solid var(--rc,var(--line));border-radius:5px;padding:12px 14px;text-align:left}
.tip h4{margin:0;font-family:var(--f-display);font-weight:700;font-size:25px;line-height:1.05;color:var(--rc,var(--bone));text-wrap:balance}
.tip .meta{margin:3px 0 9px;font-size:12px;color:var(--dim)}
.tip ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:14px;font-variant-numeric:tabular-nums}
.tip li.imp{color:#cfc5d4;border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:2px}
.tip li.ench::before{content:"◆ ";color:#8fb6ff}
.rng{color:#6b6470;font-size:12px}
.legp{color:#ff8c2a;font-style:italic;margin:9px 0 0;font-size:14px;line-height:1.35}
.cur{color:#c99bff;font-weight:700;margin:6px 0 0;font-size:14px}
.note{color:#8fb6ff;font-size:12px;margin:6px 0 0}
.cmp-h{margin:10px 0 4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.cmp li.up{color:#7fd47a}.cmp li.dn{color:#e2606c}
.warn{color:#e2606c;font-weight:700;margin:8px 0 0}
.tip.empty p{margin:0;color:var(--dim)}
.forge-list{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;width:100%}
.forge-item{width:min(330px,100%);display:flex;flex-direction:column;gap:8px}
.fbtns{display:flex;flex-direction:column;gap:6px}
.fbtn{appearance:none;font:inherit;font-size:14px;font-weight:700;text-align:left;cursor:pointer;color:var(--bone);background:var(--stone);border:1px solid var(--line);border-radius:5px;padding:8px 10px;display:flex;justify-content:space-between;gap:10px}
.fbtn span{color:var(--gold);white-space:nowrap}
.fbtn.poor span{color:#e2606c}

.rev-note{margin:0;color:#d6b3ff;font-size:14.5px;max-width:60ch}

.card.anchor{width:290px;padding:6px}
.tip li.gr{color:#ffd27a}.tip li.gr::before{content:"★ ";color:#ffd27a}
.setp{margin:9px 0 0;display:flex;flex-direction:column;gap:2px;font-size:13px;color:#6b6470}.setp b{color:#4fd16f}.setp .on{color:#7fe08e}
.sockp{margin:8px 0 0;display:flex;flex-wrap:wrap;gap:6px}.sockp.center{justify-content:center}
.rune{font-size:12px;font-weight:700;color:#bfe9ff;border:1px solid #2f4a5c;background:#101a22;border-radius:4px;padding:2px 7px}.rune.empty{color:var(--dim);border-style:dashed;background:none}
.rwp{color:#e3bd5d;font-weight:700;margin:6px 0 0;font-size:13.5px}
.tag-evo{color:#ff8c2a}
.mbtn.sm{font-size:15px;padding:9px 14px;text-align:left}
.price{margin:6px 0 0;font-weight:800;color:var(--gold);text-align:center}.price.poor{color:#e2606c}

@media (max-width:480px){.hero{width:100%}.up{width:100%;min-height:0}}
</style>

<body>

<canvas id="game"></canvas>
<div id="overlay"></div>

<script>
'use strict';
// ================== utilities ==================
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const d2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d};
const fmtTime=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const NO={};
const FD="'Grenze Gotisch', 'Times New Roman', serif", FB="'Alegreya Sans', system-ui, sans-serif";
const REDUCED=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const WORLD=3600;
const START={x:640,y:2960}, THRONE={x:2900,y:720};
function zoneR(T){if(T<150)return 4200;if(T<780)return 4200-(T-150)/630*3500;if(T<1020)return 700-(T-780)/240*180;return Math.max(0,520-(T-1020)/180*520)}
const inZone=(x,y,m)=>d2(x,y,THRONE.x,THRONE.y)<Math.max(0,zoneCur-(m||0))**2;
function clampZone(o,m){const dx=o.x-THRONE.x,dy=o.y-THRONE.y,d=Math.hypot(dx,dy)||1,R=Math.max(10,zoneCur-(m||0));if(d>R){o.x=THRONE.x+dx/d*R;o.y=THRONE.y+dy/d*R}}

// ================== canvas ==================
const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
const overlay=document.getElementById('overlay');
let CW=1280,CH=720,DPR=1,SCALE=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  CW=cv.clientWidth||1280; CH=cv.clientHeight||720;
  cv.width=Math.floor(CW*DPR); cv.height=Math.floor(CH*DPR);
  SCALE=clamp(Math.sqrt(CW*CH/(1150*650)),0.55,2.2);
}
addEventListener('resize',resize); resize();

function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
// floor pattern
let floorPat=null;
(function makeFloor(){
  const S=256,c=mkCanvas(S,S),g=c.getContext('2d');
  let seed=7; const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  g.fillStyle='#080609'; g.fillRect(0,0,S,S);
  for(let y=0;y<4;y++)for(let x=0;x<4;x++){
    const off=(y%2)*32; const v=Math.floor(24+r()*7);
    g.fillStyle=`rgb(${v+6},${v},${v+11})`;
    g.fillRect((x*64+off)%S+2,y*64+2,60,60);
    g.fillStyle='rgba(255,240,220,0.035)'; g.fillRect((x*64+off)%S+2,y*64+2,60,3);
    if(r()<0.45){g.strokeStyle='rgba(0,0,0,0.45)';g.lineWidth=1;g.beginPath();let px=(x*64+off)%S+10+r()*40,py=y*64+8+r()*20;g.moveTo(px,py);for(let k=0;k<3;k++){px+=r()*16-8;py+=8+r()*10;g.lineTo(px,py)}g.stroke()}
    if(r()<0.18){g.fillStyle='rgba(70,90,60,0.18)';g.beginPath();g.arc((x*64+off)%S+r()*60,y*64+r()*60,6+r()*10,0,TAU);g.fill()}
  }
  // wrap the offset row seam
  for(let y=1;y<4;y+=2){const v=27;g.fillStyle=`rgb(${v+6},${v},${v+11})`;g.fillRect(0,y*64+2,30,60)}

function pollInput(dt){
  const pad=getPad(); const pr={};
  if(pad&&!padSeen){padSeen=true;deviceChanged()}
  const btn=i=>!!(pad&&pad.buttons[i]&&(pad.buttons[i].pressed||pad.buttons[i].value>0.5));
  if(pad){ for(const a in PADMAP)for(const i of PADMAP[a]) if(btn(i)&&!padPrev[i]){pr[a]=true; if(lastDevice!=='pad'){lastDevice='pad';deviceChanged()}} }
  for(const a in KEYMAP)for(const k of KEYMAP[a]) if(keyQ.has(k))pr[a]=true;
  keyQ.clear();
  let mx=0,my=0;
  if(keys.has('KeyW')||keys.has('ArrowUp'))my-=1; if(keys.has('KeyS')||keys.has('ArrowDown'))my+=1;
  if(keys.has('KeyA')||keys.has('ArrowLeft'))mx-=1; if(keys.has('KeyD')||keys.has('ArrowRight'))mx+=1;
  if(pad){
    const ax=pad.axes[0]||0,ay=pad.axes[1]||0,m=Math.hypot(ax,ay);
    if(m>0.18){const s=Math.min(1,(m-0.18)/0.7)/m;mx+=ax*s;my+=ay*s; if(lastDevice!=='pad'){lastDevice='pad';deviceChanged()}}
    if(btn(12))my-=1; if(btn(13))my+=1; if(btn(14))mx-=1; if(btn(15))mx+=1;
  }
  if(inp.touch){const dx=inp.touch.x-inp.touch.ox,dy=inp.touch.y-inp.touch.oy,m=Math.hypot(dx,dy); if(m>6){const s=Math.min(1,m/55)/m;mx+=dx*s;my+=dy*s}}
  const mm=Math.hypot(mx,my); if(mm>1){mx/=mm;my/=mm}
  inp.move.x=mx; inp.move.y=my;
  inp.aimActive=false;
  if(pad){const rx=pad.axes[2]||0,ry=pad.axes[3]||0,rm=Math.hypot(rx,ry); if(rm>0.35){inp.aimActive=true;inp.aim.x=rx/rm;inp.aim.y=ry/rm}}
  const dir=Math.abs(mx)>Math.abs(my)?(mx>0.5?'right':mx<-0.5?'left':null):(my>0.5?'down':my<-0.5?'up':null);
  if(dir){ if(dir!==navHeld){navHeld=dir;navT=0.34;pr[dir]=true} else {navT-=dt; if(navT<=0){navT=0.12;pr[dir]=true}} } else navHeld=null;
  inp.held.equip=btn(0)||keys.has('KeyF');
  padPrev=pad?pad.buttons.map(b=>b.pressed||b.value>0.5):[];
  inp.pressed=pr;
}

function snareTrig(m){const x=m.x,y=m.y;query(x,y,m.R*0.85,e=>{hurt(e,m.dmg*0.25,'Snare Launcher',{stun:m.root,slow:0.9,slowT:m.root,quiet:true})});

  const newForms=checkChallenges();
  const carried=[...SLOTS.map(([s])=>P.gear[s]).filter(Boolean),...P.satchel],score=runScore(kind);
  endInfo={kind,win:kind==='win',reason,time:dirT,level:P.level,kills,cls:P.cls,dmg:Object.entries(dmgBySrc).sort((a,b)=>b[1]-a[1]),carried,kept:null,lost:[],saved:[],destroyed:[],rev:null,score,weekly:runMode==='weekly',tier:TM.tier,unlocked:false,newForms};
  if(runMode==='weekly')postScore(score,{cls:P.cls.id,time:dirT,kind,lvl:P.level});
  if(kind==='dead'){
    sfx('boss');
    const cand=carried.filter(it=>it.leg!=='soulanchor');
    if(P.leg.soulanchor>0&&cand.length){state='anchor';endInfo.cand=cand;renderAnchor(0,cand);return}
    finishDeath(null);
  } else {
    if(runMode==='weekly'){for(const it of carried)SAVE.stash.unshift(it)}
    else{SAVE.loadout={};for(const [s] of SLOTS)if(P.gear[s])SAVE.loadout[s]=P.gear[s];for(const it of P.satchel)SAVE.stash.unshift(it)}
    trimStash(); SAVE.shards+=P.shards; for(const r in P.runes)SAVE.runes[r]=(SAVE.runes[r]||0)+P.runes[r];
    if(kind==='win'&&runMode!=='weekly'&&TM.tier>=SAVE.torment.max&&SAVE.torment.max<10){SAVE.torment.max=TM.tier+1;endInfo.unlocked=true}
    SAVE.stats[kind==='win'?'wins':'extracts']++; persist();
    state='end'; renderEnd(0);
  }
}
function finishDeath(kept){
  const e=endInfo; e.kept=kept; e.saved=[]; e.destroyed=[]; e.lost=[];
  if(runMode==='weekly'){e.lost=e.carried.filter(it=>it!==kept);if(kept){kept.ch=kept.chMax;SAVE.stash.unshift(kept)}SAVE.stats.deaths++;persist();state='end';renderEnd(0);return}
  const newLoad={};
  for(const it of e.carried){
    ensureCh(it);
    if(it===kept){it.ch=it.chMax;continue}
    if(P.brought.has(it.uid)){
      it.ch--;
      if(it.ch>0){e.saved.push(it);if(P.gear[it.slot]===it&&!newLoad[it.slot])newLoad[it.slot]=it;else SAVE.stash.unshift(it)}
      else e.destroyed.push(it);
    } else e.lost.push(it);
  }
  const pref=e.destroyed.filter(it=>it.leg!=='soulanchor'),pool=pref.length?pref:e.lost.filter(it=>it.leg!=='soulanchor');
  if(pool.length){const best=pool.reduce((a,b)=>itemPower(b)>itemPower(a)?b:a),killer=P.lastHitBy||'skel';
    best.ch=1;
    const type=ETYPES[killer]?killer:killer==='collapse'?'wraith':'brute';
    SAVE.revenant={item:best,type,killer,name:pick(REV_NAMES)+' '+(REV_TITLE[killer]||'the Usurper')}; e.rev=SAVE.revenant; syncRevenant()}
  SAVE.loadout=newLoad; if(kept)SAVE.stash.unshift(kept); trimStash();
  SAVE.stats.deaths++; persist(); state='end'; renderEnd(0);
}

  for(const dir of ['left','right','up','down'])if(n&&p[dir]){moveFocus(dir);sfx('select');used=true;break}

}

function paintIcon(c,key,col,s){
  c.save();c.lineCap='round';c.lineJoin='round';c.strokeStyle=col;c.fillStyle=col;c.lineWidth=s*0.09;const r=s*0.34;
  const L=(a,b,x,y)=>{c.beginPath();c.moveTo(a,b);c.lineTo(x,y);c.stroke()};
  switch(key){
   case 'sword':L(-r,r,r*0.9,-r*0.9);L(-r*0.55,r*0.05,-r*0.05,r*0.55);break;
   case 'bolt':c.beginPath();c.arc(r*0.3,-r*0.3,r*0.42,0,TAU);c.fill();L(-r,r*0.2,-r*0.2,-r*0.05);L(-r*0.7,r*0.8,0,r*0.15);L(-r*0.2,r,r*0.15,r*0.35);break;
   case 'seed':c.beginPath();c.ellipse(0,0,r*0.45,r*0.75,0.6,0,TAU);c.fill();L(-r,-r*0.2,-r*0.5,-r*0.1);L(r,r*0.2,r*0.5,r*0.1);L(-r*0.2,r,0,r*0.6);break;
   case 'arrow':L(-r,r,r,-r);L(r,-r,r*0.2,-r);L(r,-r,r,-r*0.2);L(-r,r,-r*0.6,r*0.3);break;
   case 'fire':c.beginPath();c.moveTo(0,-r);c.quadraticCurveTo(r,-r*0.1,r*0.5,r*0.6);c.quadraticCurveTo(0,r*1.05,-r*0.5,r*0.6);c.quadraticCurveTo(-r*0.9,0,-r*0.2,-r*0.4);c.quadraticCurveTo(-r*0.1,0,0,-r);c.fill();break;
   case 'halo':c.beginPath();c.arc(0,0,r*0.75,0,TAU);c.stroke();for(let i=0;i<3;i++){const a=i/3*TAU-0.5;c.beginPath();c.arc(Math.cos(a)*r*0.75,Math.sin(a)*r*0.75,r*0.22,0,TAU);c.fill()}break;
   case 'storm':c.beginPath();c.moveTo(r*0.2,-r);c.lineTo(-r*0.4,r*0.05);c.lineTo(r*0.15,r*0.05);c.lineTo(-r*0.25,r);c.stroke();break;
   case 'nova':for(let i=0;i<3;i++){const a=i/3*Math.PI;L(Math.cos(a)*r,Math.sin(a)*r,-Math.cos(a)*r,-Math.sin(a)*r)}break;
   case 'hounds':c.beginPath();c.ellipse(0,r*0.35,r*0.45,r*0.38,0,0,TAU);c.fill();for(let i=0;i<3;i++){c.beginPath();c.arc((i-1)*r*0.48,-r*0.35-(i===1?r*0.18:0),r*0.17,0,TAU);c.fill()}break;
   case 'spear':L(-r,r,r*0.55,-r*0.55);c.beginPath();c.moveTo(r,-r);c.lineTo(r*0.25,-r*0.6);c.lineTo(r*0.6,-r*0.25);c.closePath();c.fill();break;
   case 'aura':c.beginPath();c.arc(0,0,r*0.3,0,TAU);c.fill();c.globalAlpha=0.7;c.beginPath();c.arc(0,0,r*0.62,0,TAU);c.stroke();c.globalAlpha=0.4;c.beginPath();c.arc(0,0,r*0.95,0,TAU);c.stroke();break;
   case 'axe':L(-r*0.8,r*0.8,r*0.4,-r*0.4);c.beginPath();c.arc(r*0.35,-r*0.35,r*0.6,-2.4,0.8);c.closePath();c.fill();break;
   case 'mines':c.beginPath();c.arc(0,0,r*0.75,0,TAU);c.stroke();L(-r*0.4,-r*0.4,r*0.4,r*0.4);L(r*0.4,-r*0.4,-r*0.4,r*0.4);break;
   case 'heart':c.beginPath();c.moveTo(0,r*0.8);c.bezierCurveTo(-r*1.3,-r*0.1,-r*0.5,-r*1.1,0,-r*0.35);c.bezierCurveTo(r*0.5,-r*1.1,r*1.3,-r*0.1,0,r*0.8);c.fill();break;
   case 'shield':c.beginPath();c.moveTo(0,-r);c.lineTo(r*0.8,-r*0.6);c.quadraticCurveTo(r*0.7,r*0.5,0,r);c.quadraticCurveTo(-r*0.7,r*0.5,-r*0.8,-r*0.6);c.closePath();c.fill();break;
   case 'boot':for(let i=0;i<2;i++){c.beginPath();c.moveTo(-r*0.6+i*r*0.7,-r*0.6);c.lineTo(i*r*0.7,0);c.lineTo(-r*0.6+i*r*0.7,r*0.6);c.stroke()}break;
   case 'magnet':c.beginPath();c.arc(0,-r*0.05,r*0.6,Math.PI,0,true);c.stroke();L(-r*0.6,-r*0.05,-r*0.6,-r*0.8);L(r*0.6,-r*0.05,r*0.6,-r*0.8);break;
   case 'crit':c.beginPath();c.arc(0,0,r*0.6,0,TAU);c.stroke();L(0,-r,0,-r*0.3);L(0,r,0,r*0.3);L(-r,0,-r*0.3,0);L(r,0,r*0.3,0);break;
   case 'plus':L(0,-r*0.8,0,r*0.8);L(-r*0.8,0,r*0.8,0);break;

function statMap(it){const m={};if(it)for(const a of it.aff)m[a.id]=(m[a.id]||0)+a.v;return m}
function diffLines(it,cur){const a=statMap(it),b=statMap(cur),ids=new Set([...Object.keys(a),...Object.keys(b)]),out=[];for(const id of ids){const d=Math.round(((a[id]||0)-(b[id]||0))*10)/10;if(Math.abs(d)>=0.05)out.push([id,d])}return out}
function compareHtml(it,cur){
  if(!cur)return `<p class="cmp-h">Slot is empty</p>`;
  const dl=diffLines(it,cur);
  return `<p class="cmp-h">Versus equipped ${cur.name}</p><ul class="cmp">${dl.map(([id,d])=>`<li class="${d>0?'up':'dn'}">${d>0?'▲':'▼'} ${affText(id,d)}</li>`).join('')||'<li>No stat difference</li>'}${cur.leg&&cur.leg!==it.leg?`<li class="dn">▼ Lose ${LEG[cur.leg].name} power</li>`:''}${cur.curse&&!it.curse?'<li class="up">▲ Lose curse</li>':''}${it.curse&&!cur.curse?'<li class="dn">▼ Gain curse</li>':''}</ul>`;
}
function itemTip(it,cmp,opts){
  if(!it)return `<div class="tip empty"><p>${opts&&opts.emptyText||'Empty slot'}</p></div>`;
  const R=RAR[it.rar];
  const lines=it.aff.map((a,i)=>`<li class="${a.imp?'imp':''}${i===it.ench?' ench':''}${a.gr?' gr':''}">${affText(a.id,a.v)} <span class="rng">[${fmtN(a.id,a.lo)}–${fmtN(a.id,a.hi)}]</span></li>`).join('');
  ensureCh(it);let h=`<div class="tip" style="--rc:${R.c}"><h4>${it.name}</h4><p class="meta">${R.n} ${SLOT_NAME[it.slot]} · Item level ${it.ilvl}</p><p class="pips">Charges <b>${pips(it)}</b><span>Dying with it after bringing it from home spends one. At zero it is destroyed.</span></p><ul>${lines}</ul>`;
  if(it.leg)h+=`<p class="legp">${LEG[it.leg].t}</p>`;
  if(it.curse)h+=`<p class="cur">${CURSES[it.curse].t}</p>`;
  if(it.set){const S=SETS[it.set],cnt=setCount(it.set);h+=`<div class="setp"><p><b>${S.name}</b> · ${cnt} of 4 equipped</p><p class="${cnt>=2?'on':''}">(2) ${S.b2}</p><p class="${cnt>=4?'on':''}">(4) ${S.b4}</p></div>`}
  if(it.sock&&it.sock.length)h+=`<p class="sockp">${it.sock.map(r=>r?`<span class="rune">${RUNES[r].n}: ${affText(RUNES[r].aff,RUNES[r].v)}</span>`:'<span class="rune empty">Empty socket</span>').join('')}</p>`;
  if(it.rw)h+=`<p class="rwp">Runeword ${RUNEWORDS[it.rw].n}: ${RUNEWORDS[it.rw].t}</p>`;
  if(it.ench>=0)h+=`<p class="note">Enchanted: only the ◆ affix can be rerolled.</p>`;
  if(cmp!==undefined)h+=compareHtml(it,cmp);
  return h+'</div>';
}
function itemMini(it,label){return it?`<span class="mini-name" style="color:${RAR[it.rar].c}">${it.name}</span><span class="mini-meta">${label||SLOT_NAME[it.slot]} · ilvl ${it.ilvl} · <span class="pip">${pips(ensureCh(it))}</span></span>`:`<span class="mini-name empty">Empty</span><span class="mini-meta">${label}</span>`}

// ================== save (account db with browser fallback) ==================
const SAVE_KEY='ashenHalls.save.v1';
const defaultSave=()=>({v:1,stash:[],loadout:{},revenant:null,shards:0,runes:{},codex:[],torment:{max:0},slain:[],stats:{runs:0,extracts:0,wins:0,deaths:0},t:0});
let SAVE=defaultSave(),cloudRef=null,cloudOK=false,cloudChain=Promise.resolve();
function loadLocal(){try{const s=localStorage.getItem(SAVE_KEY);if(s){const o=JSON.parse(s);if(o&&o.v===1)SAVE=Object.assign(defaultSave(),o)}}catch(e){}normSave()}
function persist(){
  SAVE.t=Date.now();const json=JSON.stringify(SAVE);
  try{localStorage.setItem(SAVE_KEY,json)}catch(e){}
  if(cloudRef){const body=JSON.parse(json),ref=cloudRef;cloudChain=cloudChain.then(()=>ref.set(body)).catch(err=>{if(err&&err.code==='invalid_argument'){cloudRef=null;cloudOK=false}})}
}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use)return;
    const db=await window.claude.use('db'),user=await window.claude.use('user');
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    const ref=db.doc('data/users/'+id+'/save'),snap=await ref.get();
    cloudRef=ref;cloudOK=true;
    if(snap.exists){const o=snap.data();if(o&&o.v===1&&(o.t||0)>(SAVE.t||0)){SAVE=Object.assign(defaultSave(),o);normSave();try{localStorage.setItem(SAVE_KEY,JSON.stringify(SAVE))}catch(e){}}}
    else if(SAVE.t)persist();
    DB=db;USER=user;MYID=id;db.doc('players/'+id).set({t:Date.now()}).catch(()=>{});if(SAVE.revenant)syncRevenant();
    if(state==='select')renderSelect(menu?menu.idx:selClass);else if(state==='armory'&&!overlay.querySelector('.inspect'))renderArmory(menu?menu.idx:0);
    refreshShared();loadBoard();
  }catch(e){cloudRef=null;cloudOK=false}
}
function normSave(){SAVE.runes=SAVE.runes||{};SAVE.codex=SAVE.codex||[];SAVE.torment=SAVE.torment||{max:0};SAVE.slain=(SAVE.slain||[]).slice(-200);SAVE.stash.forEach(ensureCh);Object.values(SAVE.loadout).forEach(it=>it&&ensureCh(it));if(SAVE.revenant)ensureCh(SAVE.revenant.item);SAVE.shards=SAVE.shards||0;if(!Array.isArray(SAVE.unlocked))SAVE.unlocked=(SAVE.stats&&SAVE.stats.runs>0)?LEGACY_HEROES.slice():[];SAVE.chal=SAVE.chal||{}}
function trimStash(){if(SAVE.stash.length>60){SAVE.stash.sort((a,b)=>itemPower(b)-itemPower(a));SAVE.stash.length=60}}
const hasGear=()=>SAVE.stash.length>0||Object.values(SAVE.loadout).some(Boolean);
const equippedCount=()=>SLOTS.filter(([s])=>SAVE.loadout[s]).length;
const stashLine=()=>`Stash ${SAVE.stash.length} items · ${equippedCount()} equipped · ${cloudOK?'Saved to your Claude account':'Saved in this browser'}`;

// ================== world: collapse, loot, shrines, portals, revenant ==================
function genSarcs(){
  sarcs=[];let tries=0;
  while(sarcs.length<24&&tries<4000){tries++;const x=wrand(150,WORLD-150),y=wrand(150,WORLD-150);
    if(d2(x,y,START.x,START.y)<300*300||d2(x,y,THRONE.x,THRONE.y)<450*450)continue;
    if(pillars.some(p=>d2(p.x,p.y,x,y)<(p.r+60)**2))continue;
    if(sarcs.some(s=>d2(s.x,s.y,x,y)<380*380))continue;
    sarcs.push({x,y,open:false,a:wrand(-0.4,0.4)})}
}
function towardThrone(dist,spread){const a=Math.atan2(THRONE.y-P.y,THRONE.x-P.x)+rand(-(spread||0),spread||0);const o={x:P.x+Math.cos(a)*dist,y:P.y+Math.sin(a)*dist};clampZone(o,80);o.x=clamp(o.x,70,WORLD-70);o.y=clamp(o.y,70,WORLD-70);for(const p of pillars)if(d2(o.x,o.y,p.x,p.y)<(p.r+40)**2){o.x+=p.r+50}return o}
function spawnPortal(kind){const o=towardThrone(170,0);portals.push({x:o.x,y:o.y,kind,life:kind==='victory'?1e9:60,lock:false});sfx('chest')}
function spawnShrine(){const o=towardThrone(380,0.6);shrines.push({x:o.x,y:o.y,life:120,lock:false});showBanner('A Forge Shrine Awakens','Spend Ash there to reroll and upgrade your gear')}
function spawnRevenant(T){
  const R=SAVE.revenant,base=ETYPES[R.type]?R.type:'brute',e=spawnEnemy(base,T,{elite:true});
  e.revenant=true;e.name=R.name;e.maxHp=e.hp=650*hpMult(T)*TM.hp*(quick?0.6:1);e.r=Math.max(e.r,20)*1.15;e.spd=Math.min(115,e.spd*1.2);
  e.dmg*=1.3;e.kbRes=0.9;e.ghost=true;e.shootT=2.5;e.color='#b46cff';e.xp=30;
  revenantE=e;showBanner(R.name,'It carries your '+R.item.name+'. Destroy it to reclaim it.');sfx('boss');
}
function updateWorld(dt){
  if(!godMode&&!inZone(P.x,P.y,0)){
    P.lastHitBy='collapse';P.hp-=P.maxHp*0.08*dt;hurtFlash=Math.max(hurtFlash,0.12);
    if(P.hp<=0){if(P.revive>0){P.revive--;P.hp=P.maxHp*0.5;P.invuln=2.5;clampZone(P,60);showBanner('Phoenix Feather Burns','You rise from the ashes')}else{endRun('dead',MAP.collapseMsg);return}}
  }
  for(const l of loot){l.x+=l.vx*dt;l.y+=l.vy*dt;const k=Math.exp(-6*dt);l.vx*=k;l.vy*=k;if(!inZone(l.x,l.y,0))l.dead=true}
  for(const s of sarcs){if(s.open)continue;if(d2(s.x,s.y,P.x,P.y)<(P.r+26)**2){s.open=true;sfx('chest');burst(s.x,s.y,'#a89a86',10,120);
    dropItem(s.x,s.y,0,0.02,0);if(Math.random()<0.12)dropRune(s.x,s.y);for(let i=0;i<3;i++)dropGem(s.x+rand(-20,20),s.y+rand(-20,20),2);if(Math.random()<0.3)pickups.push({kind:'meat',x:s.x+14,y:s.y})}}
  for(const s of shrines){s.life-=dt;const near=d2(s.x,s.y,P.x,P.y)<(P.r+28)**2;if(!near)s.lock=false;else if(!s.lock&&s.life>0){s.lock=true;openForge(s);return}}
  shrines=shrines.filter(s=>s.life>0);
  for(const p of portals){p.life-=dt;const dd=d2(p.x,p.y,P.x,P.y);if(dd>90*90)p.lock=false;if(dd<(P.r+26)**2&&!p.lock&&p.life>0){p.lock=true;openExtract(p);return}}
  portals=portals.filter(p=>p.life>0);
  loot=loot.filter(l=>!l.dead);
  let best=null,bd=40*40;for(const l of loot){const dd=d2(l.x,l.y,P.x,P.y);if(dd<bd){bd=dd;best=l}}
  if(best!==nearLoot){nearLoot=best;nearT=0;holding=false;holdT=0}
}
function removeLoot(l){loot=loot.filter(x=>x!==l);if(nearLoot===l){nearLoot=null;nearT=0;holding=false;holdT=0}}
function equipLoot(l){
  const it=l.item,old=P.gear[it.slot];
  applyItem(old,-1);P.gear[it.slot]=it;applyItem(it,1);removeLoot(l);
  if(old){if(P.satchel.length<6)P.satchel.push(old);else loot.push({x:P.x,y:P.y+22,vx:0,vy:60,item:old})}
  sfx('level');fx.push({k:'ring',x:P.x,y:P.y,r0:12,r1:50,life:0.3,max:0.3,color:RAR[it.rar].c});
}
function lootInput(dt){
  if(!nearLoot||!P)return; const p=inp.pressed;
  if(p.equip){openInspect(nearLoot);return}
  if(p.stow){if(P.satchel.length<6){P.satchel.push(nearLoot.item);removeLoot(nearLoot);sfx('gem')}else showBanner('Satchel Full','Equip or salvage something first')}
  else if(p.salvage){const v=salvageValue(nearLoot.item);gainAsh(v);nums.push({x:P.x,y:P.y-26,v:'+'+v+' Ash',life:1,ash:true});removeLoot(nearLoot);sfx('select')}
}
let inspectLoot=null;
function openInspect(l){state='inspect';inspectLoot=l;sfx('select');renderInspect(0)}
function renderInspect(idx){
  const it=inspectLoot.item,cur=P.gear[it.slot],full=P.satchel.length>=6;
  overlay.innerHTML=`<section class="screen big"><p class="eyebrow">Paused · Inspecting loot</p><div class="inspect">${itemTip(it,cur||null)}${cur?`<div class="was"><p class="lbl">Currently equipped</p>${itemTip(cur)}</div>`:''}</div>

function inspectAct(i){

function closeInspect(){inspectLoot=null;state='play';hideOverlay()}
function castMeteor(R,dmg,src){
  let best=null,bc=-1;const sample=Math.min(40,enemies.length);
  for(let i=0;i<sample;i++){const e=enemies[Math.floor(Math.random()*enemies.length)];if(e.dead||d2(e.x,e.y,P.x,P.y)>600*600)continue;let c=0;query(e.x,e.y,120,()=>{c++});if(c>bc){bc=c;best=e}}
  const tx=best?best.x:P.x+P.aimX*200,ty=best?best.y:P.y+P.aimY*200;
  fx.push({k:'tele',x:tx,y:ty,r:R,life:0.8,max:0.8});
  timers.push({t:0.8,fn:()=>{explode(tx,ty,R,dmg,src,{burnPct:0.2,kb:220});shake=Math.max(shake,R>180?14:7);if(R>180)rumble(1,0.8,400);
    zones.push({x:tx,y:ty,r:R*0.6,life:3,tick:0.35,tt:0,dmg:dmg*0.06,kind:'fire',src})}});
}

  c.strokeStyle=`rgba(${MAP.trgb},.35)`;c.lineWidth=4;c.beginPath();c.arc(X,Y,420,0,TAU);c.stroke();c.lineWidth=2;c.beginPath();c.arc(X,Y,380,0,TAU);c.stroke();

  c.fillStyle='#3d3442';c.beginPath();c.moveTo(X-40,Y-110);c.lineTo(X-30,Y-140);c.lineTo(X-15,Y-110);c.lineTo(X,Y-152);c.lineTo(X+15,Y-110);c.lineTo(X+30,Y-140);c.lineTo(X+40,Y-110);c.closePath();c.fill();

  let pool=Object.keys(EVENTS).filter(k=>!P.evUsed.includes(k));if(!pool.length){P.evUsed=[];pool=Object.keys(EVENTS)}
  const kind=pick(pool);P.evUsed.push(kind);
  const o=towardThrone(420,0.9),ev={kind,x:o.x,y:o.y,st:'idle',t:60,mobs:[],prog:0};
  if(kind==='bounty'){const p=spawnPos(250),e=spawnEnemy(pickType(dirT),dirT,{x:p[0],y:p[1],elite:true});while(e.mods.length<2){const m=pick(Object.keys(EMODS));if(!e.mods.includes(m))e.mods.push(m)}
    e.hp*=1.6;e.maxHp=e.hp;e.bounty=ev;e.name=pick(REV_NAMES)+' the Marked';ev.mobs=[e];ev.st='active';ev.x=e.x;ev.y=e.y}
  if(kind==='merchant'){for(let i=0;i<2;i++){const e=spawnEnemy('brute',dirT,{x:ev.x+(i?70:-70),y:ev.y+50,elite:true});e.mods=['shielding',pick(['fast','vampiric','molten'])];e.guard=ev;ev.mobs.push(e)}ev.st='guarded'}
  events.push(ev);showBanner(EVENTS[kind].n,EVENTS[kind].sub);sfx('chest');
}
function eventReward(x,y,min,leg,bonus,n){for(let i=0;i<(n||2);i++)dropItem(x+rand(-30,30),y+rand(-30,30),i===0?min:Math.max(0,min-1),leg,bonus);dropRune(x,y);for(let i=0;i<5;i++)dropGem(x+rand(-40,40),y+rand(-40,40),5)}
function updateEvents(dt){
  for(const ev of events){
    const near=d2(ev.x,ev.y,P.x,P.y);
    if(ev.kind==='altar'){
      if(ev.st==='idle'){ev.t-=dt;if(ev.t<=0)ev.st='gone';else if(near<(P.r+30)**2){ev.st='active';ev.t=40;for(let i=0;i<3;i++){const a=i/3*TAU,e=spawnEnemy(pickType(dirT),dirT,{x:clamp(ev.x+Math.cos(a)*220,40,WORLD-40),y:clamp(ev.y+Math.sin(a)*220,40,WORLD-40),elite:true});ev.mobs.push(e)}showBanner('The Trial Begins','Slay the three champions within 40 seconds');sfx('boss')}}
      else if(ev.st==='active'){ev.t-=dt;if(ev.mobs.every(m=>m.dead)){ev.st='done';eventReward(ev.x,ev.y,2,0.15,2);showBanner('Trial Complete','The altar yields its offering')}else if(ev.t<=0){ev.st='gone';showBanner('Trial Failed','')}}
    } else if(ev.kind==='merchant'){
      if(ev.st==='guarded'){if(ev.mobs.every(m=>m.dead)){ev.st='open';ev.t=60;ev.stock=[0,1,2].map(()=>genItem(null,rollRarity(2,0.1*TM.leg),2+Math.floor(dirT/60)+TM.ilvl));showBanner('The Merchant Is Free','Visit the cage to trade Ash for gear')}}
      else if(ev.st==='open'){ev.t-=dt;if(ev.t<=0)ev.st='gone';else if(near<(P.r+34)**2){if(!ev.lock){ev.lock=true;openMerchant(ev);return}}else ev.lock=false}
    } else if(ev.kind==='vault'){
      ev.t-=dt;if(ev.t<=0){ev.st='gone';continue}
      const inside=near<90*90;ev.prog=clamp(ev.prog+(inside?dt:-dt*0.5),0,8);
      if(inside&&ev.st==='idle'){ev.st='active';for(let i=0;i<14;i++){const a=i/14*TAU;spawnEnemy(dirT>360?'ghoul':'skel',dirT,{x:clamp(ev.x+Math.cos(a)*320,30,WORLD-30),y:clamp(ev.y+Math.sin(a)*320,30,WORLD-30)})}}
      if(ev.prog>=8){ev.st='done';eventReward(ev.x,ev.y,1,0.08,2,4);showBanner('The Vault Cracks Open','')}
    } else if(ev.kind==='bounty'){
      const m=ev.mobs[0];ev.t-=dt;
      if(m.dead){ev.st='done';if(!m.escaped){eventReward(m.x,m.y,2,0.2,3);gainAsh(40);showBanner('Bounty Claimed','')}}
      else if(ev.t<=0){m.dead=true;m.escaped=true;burst(m.x,m.y,'#b46cff',20,150);ev.st='gone';showBanner('The Bounty Escaped','')}
      else{ev.x=m.x;ev.y=m.y}
    }
  }
  events=events.filter(e=>e.st!=='gone'&&e.st!=='done');
}
let merchEv=null;
const merchPrice=it=>Math.round(salvageValue(it)*2.4);
function openMerchant(ev){merchEv=ev;state='merchant';renderMerchant(0)}
function renderMerchant(idx){
  const ev=merchEv,cards=ev.stock.map(it=>`<button class="opt card anchor">${itemTip(it,P.gear[it.slot]||null)}<p class="price${P.ash<merchPrice(it)?' poor':''}">${merchPrice(it)} Ash</p></button>`).join('');
  overlay.innerHTML=`<section class="screen big"><p class="eyebrow">Caged Merchant</p><h2>${P.ash} Ash</h2><p class="sub">You freed me. Take one, for a price. Bought gear goes to your satchel.</p><div class="cards">${cards}</div><div class="menu-list"><button class="opt mbtn">Leave</button></div>${hints([['nav','Move'],['confirm','Buy'],['back','Leave']])}</section>`;
  showOverlay();bindMenu({idx,onBack:leaveMerchant,onPick:i=>{if(i>=ev.stock.length)return leaveMerchant();const it=ev.stock[i],c=merchPrice(it);if(P.ash<c||P.satchel.length>=6){sfx('hurt');return}P.ash-=c;P.satchel.push(it);ev.st='gone';sfx('level');leaveMerchant()}});
}
function leaveMerchant(){state='play';hideOverlay()}
function drawEvents(c,t,onScr){
  for(const h of hazards){if(!onScr(h.x,h.y,h.r))continue;const col=HZC[h.kind];
    if(h.delay>0){const k=h.d0?1-h.delay/h.d0:1;c.strokeStyle=`rgba(${col},.85)`;c.lineWidth=2.5;c.beginPath();c.arc(h.x,h.y,h.r,0,TAU);c.stroke();c.fillStyle=`rgba(${col},.28)`;circ(c,h.x,h.y,h.r*k)}
    else if(!h.once){c.fillStyle=`rgba(${col},${0.22+0.08*Math.sin(t*8+h.x)})`;circ(c,h.x,h.y,h.r)}}
  for(const ev of events){if(ev.kind==='bounty'||!onScr(ev.x,ev.y,120))continue;
    if(ev.kind==='altar'){c.fillStyle='rgba(0,0,0,.45)';ell(c,ev.x,ev.y+16,30,10);c.fillStyle='#2b2530';c.fillRect(ev.x-22,ev.y-14,44,28);c.fillStyle='#3d3442';c.fillRect(ev.x-26,ev.y-20,52,8);
      for(let i=0;i<3;i++){c.fillStyle=i%2?'#ff4d6d':'#c4283d';circ(c,ev.x+(i-1)*14,ev.y-26-Math.abs(Math.sin(t*8+i))*8,5)}
      if(ev.st==='idle'){c.strokeStyle='rgba(255,77,109,.5)';c.lineWidth=2;c.beginPath();c.arc(ev.x,ev.y,36,0,TAU);c.stroke()}}
    else if(ev.kind==='merchant'){c.fillStyle='rgba(0,0,0,.45)';ell(c,ev.x,ev.y+20,28,9);c.fillStyle='#d9b894';circ(c,ev.x,ev.y-6,8);c.fillStyle='#5a4a7a';ell(c,ev.x,ev.y+8,11,12);
      if(ev.st==='guarded'){c.strokeStyle='#8a8090';c.lineWidth=3;for(let i=-2;i<=2;i++){c.beginPath();c.moveTo(ev.x+i*8,ev.y-26);c.lineTo(ev.x+i*8,ev.y+22);c.stroke()}c.beginPath();c.moveTo(ev.x-22,ev.y-26);c.lineTo(ev.x+22,ev.y-26);c.stroke()}
      else{c.strokeStyle=`rgba(227,189,93,${0.5+0.3*Math.sin(t*4)})`;c.lineWidth=2;c.beginPath();c.arc(ev.x,ev.y,38,0,TAU);c.stroke()}}
    else if(ev.kind==='vault'){c.strokeStyle='rgba(227,189,93,.7)';c.lineWidth=3;c.setLineDash([10,8]);c.beginPath();c.arc(ev.x,ev.y,90,t*0.4,t*0.4+TAU);c.stroke();c.setLineDash([]);
      c.fillStyle='rgba(227,189,93,.08)';circ(c,ev.x,ev.y,90);c.strokeStyle='#e3bd5d';c.lineWidth=6;c.beginPath();c.arc(ev.x,ev.y,96,-Math.PI/2,-Math.PI/2+TAU*ev.prog/8);c.stroke();
      c.fillStyle='#3d3442';c.fillRect(ev.x-16,ev.y-12,32,24);c.fillStyle='#e3bd5d';c.fillRect(ev.x-16,ev.y-3,32,4)}}
}
function eventStatus(){const out=[];for(const ev of events){
  if(ev.kind==='altar')out.push(ev.st==='active'?`Trial: ${ev.mobs.filter(m=>!m.dead).length} champions left · ${Math.ceil(ev.t)}s`:`Cursed Altar nearby · ${Math.ceil(ev.t)}s`);
  else if(ev.kind==='merchant')out.push(ev.st==='guarded'?'Caged Merchant: slay the 2 guards':`Merchant open · ${Math.ceil(ev.t)}s`);
  else if(ev.kind==='vault')out.push(`Treasure Vault ${Math.round(ev.prog/8*100)}% · ${Math.ceil(ev.t)}s`);
  else if(ev.kind==='bounty')out.push(`Bounty: ${ev.mobs[0].name} · ${Math.ceil(ev.t)}s`)}return out}

let DB=null,USER=null,MYID=null,FRIENDS=[],PROFILES={},INBOX=[],FRIEND_REVS=[],BOARD=[];

async function resolveNames(ids){if(!USER||!ids.length)return;try{const ps=await USER.profiles(ids);for(const id in ps)PROFILES[id]=ps[id]}catch(e){}}
async function refreshShared(){
  if(!DB||!MYID)return;
  try{
    const [pl,rv,gf]=await Promise.all([DB.collection('players').get(),DB.collection('revenants').get(),DB.collection('gifts').where('to','==',MYID).get()]);
    FRIENDS=pl.docs.map(d=>d.id).filter(id=>id!==MYID);
    FRIEND_REVS=rv.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.id!==MYID&&r.item&&!SAVE.slain.includes(r.item.uid));
    INBOX=gf.docs.map(d=>({gid:d.id,...d.data()})).filter(g=>g.item);
    await resolveNames([...new Set([...FRIENDS,...FRIEND_REVS.map(r=>r.id),...INBOX.map(g=>g.from)])]);
    if(state==='armory'&&menu&&!overlay.querySelector('.inspect'))renderArmory(menu.idx);
  }catch(e){}
}
function syncRevenant(){if(!DB||!MYID)return;const ref=DB.doc('revenants/'+MYID);(SAVE.revenant?ref.set({item:JSON.parse(JSON.stringify(SAVE.revenant.item)),name:SAVE.revenant.name,type:SAVE.revenant.type,t:Date.now()}):ref.delete()).catch(()=>{})}
async function sendGift(to,item,kind){if(!DB||!MYID)return false;try{await DB.collection('gifts').add({to,from:MYID,kind,item:JSON.parse(JSON.stringify(item)),t:Date.now()});return true}catch(e){return false}}
function claimGift(i,idx){
  const g=INBOX[i];if(!g)return;const it=ensureCh(g.item);
  const owned=SAVE.stash.some(x=>x.uid===it.uid)||Object.values(SAVE.loadout).some(x=>x&&x.uid===it.uid);
  if(!owned){if(SAVE.stash.length>=60){sfx('hurt');return}SAVE.stash.unshift(it)}
  if(SAVE.revenant&&SAVE.revenant.item.uid===it.uid){SAVE.revenant=null;syncRevenant()}
  INBOX.splice(i,1);persist();if(DB)DB.collection('gifts').doc(g.gid).delete().catch(()=>{});sfx('chest');renderArmory(idx);
}

async function postScore(score,info){if(!DB||!MYID)return;try{const ref=DB.doc('scores/'+MYID),cur=await ref.get(),d=cur.exists?cur.data():null;if(!d||d.week!==weekId()||score>d.score)await ref.set({week:weekId(),score,cls:info.cls,time:Math.round(info.time),kind:info.kind,lvl:info.lvl,t:Date.now()})}catch(e){}}

function armoryPick(i){
  const el=menu.items[i];if(!el)return;const k=el.dataset.k,[t,v]=k.split(':');
  if(k==='go')return startRun(selClass);if(k==='back')return renderSelect(selClass);if(k==='codex')return renderCodex(i);
  if(t==='G')return claimGift(+v,i);
  const it=t==='L'?SAVE.loadout[v]:SAVE.stash[+v];if(!it)return;
  renderItemActions(it,t,t==='L'?v:+v,i,0);
}
function armoryDetail(i){
  const d=document.getElementById('detail');if(!d||!menu||!menu.items[i])return;
  const k=menu.items[i].dataset.k,[t,v]=k.split(':');
  if(t==='L')d.innerHTML=itemTip(SAVE.loadout[v],undefined,{emptyText:'Nothing equipped here. Pick an item from your stash to wear it into the halls.'});
  else if(t==='S'){const it=SAVE.stash[+v];d.innerHTML=itemTip(it,SAVE.loadout[it.slot]||null)}
  else if(t==='G'){const g=INBOX[+v];d.innerHTML=itemTip(g.item)+`<p class="note">${glyph('confirm')} claims it into your stash.</p>`}
  else if(k==='go')d.innerHTML=`<div class="tip plain"><h4>Descend</h4><p class="meta">${equippedCount()} of 6 slots equipped${tierSel?' · Torment '+tierSel:''}</p>${SAVE.revenant?`<p class="rev-note">${SAVE.revenant.name} waits below with your ${SAVE.revenant.item.name}.</p>`:''}${FRIEND_REVS.length?`<p class="rev-note">${FRIEND_REVS.length} friend Revenant${FRIEND_REVS.length>1?'s':''} roam the halls.</p>`:''}</div>`;
  else if(k==='codex')d.innerHTML=`<div class="tip plain"><h4>Runeword codex</h4><p class="meta">${SAVE.codex.length} of ${Object.keys(RUNEWORDS).length} discovered</p></div>`;
  else d.innerHTML='';
}
function renderItemActions(it,where,key,back,idx){
  const acts=[];ensureCh(it);
  if(where==='S')acts.push(['Equip',()=>{const old=SAVE.loadout[it.slot];SAVE.loadout[it.slot]=it;SAVE.stash.splice(key,1);if(old)SAVE.stash.splice(key,0,old);persist();renderArmory(back)}]);
  else acts.push(['Unequip',()=>{if(SAVE.stash.length>=60){sfx('hurt');return}SAVE.stash.unshift(it);delete SAVE.loadout[key];persist();renderArmory(back)}]);
  if((it.sock||[]).includes(null))for(const [r,n] of Object.entries(SAVE.runes))if(n>0)acts.push([`Socket ${RUNES[r].n} rune (${affText(RUNES[r].aff,RUNES[r].v)}) · ${n} owned`,()=>{socketRune(it,r);renderItemActions(it,where,key,back,0)}]);
  if(it.ch<it.chMax)acts.push([`Rekindle a charge · ${SAVE.shards} Ember Shard${SAVE.shards===1?'':'s'}`,()=>{if(SAVE.shards<1){sfx('hurt');return}it.ch++;SAVE.shards--;persist();sfx('level');renderItemActions(it,where,key,back,acts.length>2?2:1)}]);
  if(cloudOK&&FRIENDS.length&&where==='S')acts.push(['Send to a friend',()=>renderFriendPick(it,key,back)]);
  if(where==='S')acts.push(['Destroy item',()=>{if(menuCtx!=='destroy'){menuCtx='destroy';sfx('hurt');const el=document.getElementById('confirm');if(el)el.textContent='Select Destroy item again to destroy it for good.';return}menuCtx=null;SAVE.stash.splice(key,1);persist();renderArmory(Math.max(0,back-1))}]);
  acts.push(['Back',()=>renderArmory(back)]);
  menuCtx=null;
  overlay.innerHTML=`<section class="screen big"><p class="eyebrow">${where==='S'?'Stash item':'Equipped item'}</p><div class="inspect">${itemTip(it,where==='S'?(SAVE.loadout[it.slot]||null):undefined)}<div class="menu-list">${acts.map(a=>`<button class="opt mbtn sm">${a[0]}</button>`).join('')}<p class="warn" id="confirm"></p></div></div>${hints([['nav','Move'],['confirm','Select'],['back','Back']])}</section>`;
  showOverlay();bindMenu({idx:Math.min(idx||0,acts.length-1),onBack:()=>renderArmory(back),onPick:i=>acts[i][1]()});
}
function renderFriendPick(it,key,back){
  overlay.innerHTML=`<section class="screen big"><p class="eyebrow">Send to a friend</p><h2>${esc(it.name)}</h2><p class="sub">The item leaves your stash and lands in their Armory inbox.</p><div class="menu-list">${FRIENDS.map(id=>`<button class="opt mbtn sm">${esc(nameOf(id))}</button>`).join('')}<button class="opt mbtn sm">Cancel</button></div>${hints([['nav','Move'],['confirm','Send'],['back','Cancel']])}</section>`;
  showOverlay();
  bindMenu({idx:0,onBack:()=>renderArmory(back),onPick:i=>{if(i>=FRIENDS.length)return renderArmory(back);const to=FRIENDS[i];sendGift(to,it,'gift').then(ok=>{if(ok){const j=SAVE.stash.indexOf(it);if(j>=0)SAVE.stash.splice(j,1);persist();showToast('Sent to '+nameOf(to))}else showToast('Could not send. Try again.');renderArmory(back)})}});
}
function showToast(t){banner={text:t,sub:'',t:2.5}}
function renderCodex(back){
  const rows=Object.entries(RUNEWORDS).map(([k,R])=>SAVE.codex.includes(k)?`<div class="tip plain"><h4>${R.n}</h4><p class="meta">${R.r.map(r=>RUNES[r].n).join(' then ')}, in a 2-socket item</p><p class="legp">${R.t}</p></div>`:`<div class="tip plain"><h4>Unknown runeword</h4><p class="meta">Two runes, in a certain order</p></div>`).join('');
  overlay.innerHTML=`<section class="screen big"><p class="eyebrow">Runeword codex</p><h2>${SAVE.codex.length} of ${Object.keys(RUNEWORDS).length}</h2><p class="sub">Socket runes into an item in the right order to awaken a runeword. Runes cannot be removed once socketed.</p><div class="codex">${rows}</div><div class="menu-list"><button class="opt mbtn">Back</button></div>${hints([['confirm','Back']])}</section>`;
  showOverlay();bindMenu({idx:0,onBack:()=>renderArmory(back),onPick:()=>renderArmory(back)});
}

// ================== v5: maps ==================
function makeOssFloor(){
  const S=256,c=mkCanvas(S,S),g=c.getContext('2d');let seed=11;const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  g.fillStyle='#04090b';g.fillRect(0,0,S,S);
  for(let y=0;y<4;y++)for(let x=0;x<4;x++){const off=(y%2)*32,v=Math.floor(22+r()*7),tx=(x*64+off)%S+2,ty=y*64+2;
    g.fillStyle=`rgb(${v-4},${v+8},${v+12})`;g.fillRect(tx,ty,60,60);g.fillStyle='rgba(200,255,250,0.04)';g.fillRect(tx,ty,60,3);
    if(r()<0.4){g.fillStyle='rgba(30,110,115,0.28)';g.beginPath();g.ellipse(tx+10+r()*40,ty+10+r()*40,10+r()*14,5+r()*6,0,0,TAU);g.fill()}
    if(r()<0.3){g.fillStyle='rgba(80,140,70,0.18)';g.beginPath();g.arc(tx+r()*60,ty+r()*60,5+r()*8,0,TAU);g.fill()}
    if(r()<0.35){g.strokeStyle='rgba(0,0,0,0.45)';g.lineWidth=1;g.beginPath();let px=tx+8+r()*40,py=ty+8+r()*20;g.moveTo(px,py);for(let k=0;k<3;k++){px+=r()*16-8;py+=8+r()*10;g.lineTo(px,py)}g.stroke()}}
  for(let y=1;y<4;y+=2){const v=25;g.fillStyle=`rgb(${v-4},${v+8},${v+12})`;g.fillRect(0,y*64+2,30,60)}
  return ctx.createPattern(c,'repeat');
}
function makeWater(){const S=128,c=mkCanvas(S,S),g=c.getContext('2d');g.fillStyle='#03121a';g.fillRect(0,0,S,S);g.strokeStyle='rgba(120,220,230,.2)';g.lineWidth=2;g.lineCap='round';
  for(let i=0;i<16;i++){const x=Math.random()*S,y=Math.random()*S,w=10+Math.random()*24;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+w/2,y-4,x+w,y);g.stroke()}return ctx.createPattern(c,'repeat')}
const BOSSES_OSS=[
 {at:270,id:'siren',name:'The Pale Siren',short:'Siren',sub:'A song rises from the black water',hp:4800,r:36,spd:52,dmg:22,color:'#9fe8e0'},
 {at:540,id:'hydra',name:'The Ossuary Hydra',short:'Hydra',sub:'Three heads break the surface',hp:20000,r:46,spd:40,dmg:24,color:'#3f8a7a'},
 {at:780,id:'drownedking',name:'The Drowned King',short:'Drowned King',sub:'Slay him before the flood takes the halls',hp:90000,r:60,spd:48,dmg:34,color:'#2a6a8a',final:true},
];
const MAPS={
 crypt:{id:'crypt',name:'The Ashen Crypt',start:{x:640,y:2960},throne:{x:2900,y:720},bosses:BOSSES,flame:['#ff6a2a','#ffb24a'],light:'#ff7a2a',pool:'208,117,46',edge:['255,60,40','255,110,40'],dust:'#7a6a5e',fog:'#3a2c38',trgb:'196,40,61',
   collapseMsg:'Crushed by the collapsing halls.',timeoutMsg:'The halls collapsed before the Tormentor fell.',warn:['The Halls Are Crumbling','Fight toward the Throne. Follow the orange arrow.'],warnOut:'The halls are collapsing on you',floorPat,rubble:rubblePat},
 ossuary:{id:'ossuary',name:'The Sunken Ossuary',start:{x:620,y:620},throne:{x:2960,y:2880},bosses:BOSSES_OSS,flame:['#5fd0c4','#d8fff8'],light:'#3fb8ac',pool:'63,184,172',edge:['40,150,190','150,230,240'],dust:'#9fd8e0',fog:'#2a4a50',trgb:'63,184,172',
   collapseMsg:'Dragged under by the rising flood.',timeoutMsg:'The flood took the halls before the Drowned King fell.',warn:['The Waters Are Rising','Wade toward the Drowned Throne. Follow the arrow.'],warnOut:'The flood is pulling you under',floorPat:makeOssFloor(),rubble:makeWater()},
};
let MAP=MAPS.crypt,mapSel='crypt';
function applyMap(id){MAP=MAPS[id]||MAPS.crypt;START.x=MAP.start.x;START.y=MAP.start.y;THRONE.x=MAP.throne.x;THRONE.y=MAP.throne.y;BOSSES=MAP.bosses;floorPat=MAP.floorPat;rubblePat=MAP.rubble}
function toggleMap(){mapSel=mapSel==='crypt'?'ossuary':'crypt';renderSelect(menu?menu.idx:selClass)}
const weeklyMap=()=>hashStr(weekId()+'map')%2?'ossuary':'crypt';

// ================== v5: animation helpers ==================
let corpses=[];
function legs(c,wk,y,spread,len,col){const a=Math.sin(wk)*len*0.45;c.lineCap='round';c.strokeStyle='#080609';c.lineWidth=4.2;c.beginPath();c.moveTo(-spread,y);c.lineTo(-spread+a,y+len);c.moveTo(spread,y);c.lineTo(spread-a,y+len);c.stroke();c.strokeStyle=col;c.lineWidth=2.2;c.stroke()}
function drawCorpses(c,t,onScr){
  for(const k of corpses){if(!onScr(k.x,k.y,60))continue;const p=Math.min(1,k.t/0.3);c.save();c.globalAlpha=Math.max(0,1-Math.max(0,k.t-0.4)/0.5);c.translate(k.x,k.y+p*4);c.rotate(k.face*p*1.35);c.scale(1,1-0.25*p);
    drawEnemy(c,{type:k.type,x:0,y:0,r:k.r,face:k.face,walk:0,spawnT:1,hitT:0,flash:0,burnT:0,slowT:0,hp:1,maxHp:1,seed:k.seed,shootT:9,st:''},t);c.restore()}
}

// ================== main loop ==================
let lastT=performance.now();
function frame(now){
  const dt=Math.min(0.05,Math.max(0,(now-lastT)/1000));lastT=now;
  pollInput(dt);
  if(inp.pressed.mute&&state!=='pause'){muted=!muted;if(state==='select')renderSelect(menu?menu.idx:selClass)}
  if(state==='play'){
    if(inp.pressed.pause)openPause();
    else{if(inp.pressed.dev)dirT+=60;lootInput(dt);if(state==='play')update(dt)}
  } else if(handleMenuInput())inp.pressed={};
  render(dt);
  requestAnimationFrame(frame);
}
window.__drawHero=drawHero;window.__game={startRun,update,render,chooseOption,chooseRelic,setQuick:v=>quick=v,state:()=>state,get P(){return P},get enemies(){return enemies},get dirT(){return dirT},get kills(){return kills},get boss(){return boss},inp,setGod:v=>godMode=v,get endInfo(){return endInfo},get curOpts(){return curOpts},
  lootInput,genItem,applyItem,endRun,RUNES,RUNEWORDS,SETS,EVOS,setMode:m=>{runMode=m;quick=m==='quick'},setTier:t=>{tierSel=t},setMap:m=>{mapSel=m},get MAP(){return MAP},get events(){return events},get SAVE(){return SAVE},get zoneCur(){return zoneCur},THRONE,get loot(){return loot},get revenantE(){return revenantE},get portals(){return portals},
  menuPick:i=>menu&&menu.onPick(i),menuBack:()=>menu&&menu.onBack&&menu.onBack(),CLASSES,CHAL,unlockAll:v=>devUnlockAll=v,renderSelect};
loadLocal();
renderSelect(0);
requestAnimationFrame(frame);
initCloud();
